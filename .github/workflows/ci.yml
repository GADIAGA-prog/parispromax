name: Quality checks

on:
  push:
    branches: [master, main, codex/apk-test-sdk56]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - name: Run backend tests
        shell: bash
        run: |
          set -o pipefail
          node --test test/*.test.js 2>&1 | tee test-output.log
      - name: Publish backend test failure
        if: failure()
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('test-output.log','utf8');const failed=[...s.matchAll(/^(?:not ok \d+ - |✖ )([^\r\n]+)$/gm)].map(m=>m[1]);const names=[...new Set(failed)].join(', ')||'échec sans test identifié';console.log('::error title=Backend tests en échec::'+names)"
      - run: npm run check:prod
        env:
          DATABASE_URL: postgresql://check:check@localhost:5432/check

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npx expo install --check
      - run: npx expo config --type public

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q ml
